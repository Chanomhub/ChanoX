# CodeQL Advanced Analysis for ChanoX
# Optimized for Tauri (Rust) + React (TypeScript) application
name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run every Thursday at 17:21 UTC
    - cron: '21 17 * * 4'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'rust' && 'ubuntu-latest') || 'ubuntu-latest' }}
    timeout-minutes: 360
    permissions:
      # Required for all workflows
      security-events: write
      # Required to fetch internal or private CodeQL packs
      packages: read
      # Required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        # Rust analysis for Tauri backend (src-tauri/)
        - language: rust
          build-mode: none
        
        # JavaScript/TypeScript analysis for React frontend (src/)
        - language: javascript-typescript
          build-mode: none
        
        # GitHub Actions workflow analysis
        - language: actions
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Install pnpm FIRST (before setup-node)
    - name: Install pnpm
      if: matrix.language == 'javascript-typescript'
      uses: pnpm/action-setup@v4
      with:
        version: 8

    # Setup Node.js for TypeScript/React dependencies
    - name: Setup Node.js
      if: matrix.language == 'javascript-typescript'
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        # Only enable cache if pnpm-lock.yaml exists
        cache: ${{ hashFiles('**/pnpm-lock.yaml') != '' && 'pnpm' || '' }}

    # Setup Rust toolchain for Tauri backend
    - name: Setup Rust
      if: matrix.language == 'rust'
      uses: dtolnay/rust-toolchain@stable

    # Cache Rust dependencies
    - name: Cache Rust dependencies
      if: matrix.language == 'rust'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri

    # Install system dependencies for Tauri (Linux)
    - name: Install Tauri dependencies (Linux)
      if: matrix.language == 'rust' && runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf
        # Try to install appindicator (prefer ayatana, fallback to legacy)
        sudo apt-get install -y libayatana-appindicator3-dev || sudo apt-get install -y libappindicator3-dev

    # Initialize CodeQL
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # Uncomment to use custom queries
        # queries: security-extended,security-and-quality

    # Perform CodeQL Analysis
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
        output: sarif-results
        upload: true

    # Upload SARIF results as artifact
    - name: Upload SARIF results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: codeql-results-${{ matrix.language }}
        path: sarif-results
        retention-days: 5
